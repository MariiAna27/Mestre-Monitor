name: Build and publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set R library cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/R-library"
          echo "R_LIBS_USER=$RUNNER_TEMP/R-library" >> "$GITHUB_ENV"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/R-library
          key: ${{ runner.os }}-r-library-${{ hashFiles('R/instalar_pacotes.R') }}
          restore-keys: |
            ${{ runner.os }}-r-library-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: Rscript R/instalar_pacotes.R

      - name: Build data
        run: Rscript R/build_data.R

      - name: Validate data
        run: Rscript R/validar_dados.R

      - name: Render site
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
